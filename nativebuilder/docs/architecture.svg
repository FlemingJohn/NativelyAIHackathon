<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" width="1400" height="1020" role="img" aria-label="Venture Foundry architecture — native.builder frontend, Supabase Edge Functions, Bright Data and AI/ML API">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="55%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="railGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="railBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="18%" stop-color="#52525b" stop-opacity="1"/>
      <stop offset="82%" stop-color="#52525b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <filter id="glowG" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aGrey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <style>
    .h1   { font-family:'Segoe UI',system-ui,sans-serif; font-size:30px; font-weight:600; fill:#fafafa; letter-spacing:-.6px }
    .zone { font-family:ui-monospace,'Cascadia Mono',monospace; font-size:11px; fill:#71717a; letter-spacing:2.6px }
    .name { font-family:'Segoe UI',system-ui,sans-serif; font-size:16px; font-weight:600; fill:#f4f4f5 }
    .sub  { font-family:'Segoe UI',system-ui,sans-serif; font-size:12.5px; fill:#a1a1aa }
    .mono { font-family:ui-monospace,monospace; font-size:11px; fill:#8b8b93 }
    .step { font-family:'Segoe UI',system-ui,sans-serif; font-size:17px; font-weight:600; fill:#fafafa }
    .num  { font-family:ui-monospace,monospace; font-size:12px; fill:#52525b; letter-spacing:1px }
    .green{ fill:#4ade80 } .blue { fill:#93c5fd } .amber{ fill:#fbbf24 }
    .card { fill:#141418; stroke:#27272a }
    .well { fill:#101014; stroke:#1f1f23 }
  </style>

  <rect width="1400" height="1020" fill="url(#ground)"/>
  <rect width="1400" height="1020" fill="url(#grid)"/>

  <!-- ══════════════════════ title ══════════════════════ -->
  <g transform="translate(56 62)">
    <g stroke="#fafafa" stroke-width="1.7" fill="none" stroke-linecap="round" transform="scale(1.25)">
      <path d="M19.9 12.7A8 8 0 0 1 12.7 19.9"/><path d="M11.3 19.9A8 8 0 0 1 4.1 12.7"/>
      <path d="M4.1 11.3A8 8 0 0 1 11.3 4.1"/><path d="M12.7 4.1A8 8 0 0 1 19.9 11.3"/>
      <circle cx="12" cy="12" r="2.2" fill="#fafafa" stroke="none"/>
    </g>
    <text x="46" y="24" class="h1">Venture Foundry</text>
    <text x="46" y="46" class="mono">THE MODEL NEVER SUPPLIES THE EVIDENCE</text>
  </g>
  <rect x="56" y="128" width="1288" height="1" fill="url(#hairline)"/>

  <!-- ══════════════════════ 1 · frontend ══════════════════════ -->
  <text x="56" y="172" class="zone">01 · FRONTEND — VITE + REACT, BUILT AND DEPLOYED WITH NATIVE.BUILDER</text>

  <rect x="56" y="188" width="1288" height="134" rx="12" class="card"/>

  <!-- native.builder mark -->
  <g transform="translate(78 208)">
    <rect width="34" height="34" rx="9" fill="#fafafa"/>
    <path d="M10 25V9l14 16V9" fill="none" stroke="#09090b" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="124" y="224" class="name">native.builder</text>
  <text x="124" y="243" class="sub">*.nativelyai.app</text>

  <line x1="250" y1="204" x2="250" y2="306" stroke="#27272a"/>

  <g>
    <rect x="276" y="212" width="196" height="86" rx="8" class="well"/>
    <text x="294" y="238" class="num">01</text>
    <text x="294" y="260" class="name">Ideation</text>
    <text x="294" y="281" class="sub">writes <tspan class="mono">domain</tspan></text>

    <rect x="490" y="212" width="196" height="86" rx="8" class="well"/>
    <text x="508" y="238" class="num">02</text>
    <text x="508" y="260" class="name">Market</text>
    <text x="508" y="281" class="sub">writes <tspan class="mono">idea_text</tspan></text>

    <rect x="704" y="212" width="196" height="86" rx="8" class="well"/>
    <text x="722" y="238" class="num">03</text>
    <text x="722" y="260" class="name">People</text>
    <text x="722" y="281" class="sub">writes <tspan class="mono">founder_skills</tspan></text>

    <rect x="918" y="212" width="196" height="86" rx="8" class="well"/>
    <text x="936" y="238" class="num">04</text>
    <text x="936" y="260" class="name">Capital</text>
    <text x="936" y="281" class="sub">reads domain + TAM</text>

    <rect x="1132" y="212" width="190" height="86" rx="8" fill="#0f1a12" stroke="#22c55e" stroke-opacity=".35"/>
    <text x="1150" y="238" class="num">SHARED</text>
    <text x="1150" y="260" class="name">Startup profile</text>
    <text x="1150" y="281" class="sub">one file, all four</text>
  </g>

  <!-- chain arrows -->
  <path d="M474 255 L487 255" stroke="#52525b" stroke-width="1.4" marker-end="url(#aGrey)"/>
  <path d="M688 255 L701 255" stroke="#52525b" stroke-width="1.4" marker-end="url(#aGrey)"/>
  <path d="M902 255 L915 255" stroke="#52525b" stroke-width="1.4" marker-end="url(#aGrey)"/>
  <path d="M1116 255 L1129 255" stroke="#22c55e" stroke-width="1.4" marker-end="url(#aGreen)"/>

  <!-- boundary -->
  <path d="M700 322 L700 372" stroke="#52525b" stroke-width="1.5" marker-end="url(#aGrey)"/>
  <g transform="translate(716 340)">
    <rect width="330" height="24" rx="12" fill="#141418" stroke="#27272a"/>
    <text x="14" y="16" class="mono">publishable key · RLS denies it every row</text>
  </g>

  <!-- ══════════════════════ 2 · edge functions ══════════════════════ -->
  <text x="56" y="404" class="zone">02 · SUPABASE EDGE FUNCTIONS — DENO / TYPESCRIPT · SECRETS NEVER REACH THE BROWSER</text>

  <rect x="56" y="420" width="1288" height="250" rx="12" class="card"/>
  <text x="80" y="452" class="sub">Every module runs the same three steps — the order is the guarantee.</text>

  <!-- step 1 -->
  <rect x="80" y="470" width="378" height="176" rx="10" class="well"/>
  <rect x="80" y="470" width="4" height="176" rx="2" fill="url(#railGreen)"/>
  <text x="104" y="500" class="num">STEP 01</text>
  <text x="104" y="528" class="step">Gather</text>
  <text x="104" y="554" class="sub">Bright Data SERP API returns parsed</text>
  <text x="104" y="573" class="sub">Google results — we never touch HTML.</text>
  <g transform="translate(104 592)">
    <rect width="234" height="24" rx="6" fill="#0f1a12" stroke="#22c55e" stroke-opacity=".3"/>
    <text x="12" y="16" class="mono" fill="#4ade80">cached in scrape_cache</text>
  </g>

  <!-- step 2 -->
  <rect x="478" y="470" width="378" height="176" rx="10" class="well"/>
  <rect x="478" y="470" width="4" height="176" rx="2" fill="url(#railBlue)"/>
  <text x="502" y="500" class="num">STEP 02</text>
  <text x="502" y="528" class="step">Extract</text>
  <text x="502" y="554" class="sub">A cheap model turns raw results into</text>
  <text x="502" y="573" class="sub">structured JSON facts.</text>
  <g transform="translate(502 592)">
    <rect width="150" height="24" rx="6" fill="#0d1520" stroke="#60a5fa" stroke-opacity=".3"/>
    <text x="12" y="16" class="mono" fill="#93c5fd">gpt-4o-mini</text>
  </g>

  <!-- step 3 -->
  <rect x="876" y="470" width="378" height="176" rx="10" class="well"/>
  <rect x="876" y="470" width="4" height="176" rx="2" fill="url(#railBlue)"/>
  <text x="900" y="500" class="num">STEP 03</text>
  <text x="900" y="528" class="step">Synthesize</text>
  <text x="900" y="554" class="sub">A stronger model reasons only over</text>
  <text x="900" y="573" class="sub">those facts, plus your profile.</text>
  <g transform="translate(900 592)">
    <rect width="122" height="24" rx="6" fill="#0d1520" stroke="#60a5fa" stroke-opacity=".3"/>
    <text x="12" y="16" class="mono" fill="#93c5fd">gpt-4o</text>
  </g>

  <path d="M462 558 L474 558" stroke="#52525b" stroke-width="1.4" marker-end="url(#aGrey)"/>
  <path d="M860 558 L872 558" stroke="#52525b" stroke-width="1.4" marker-end="url(#aGrey)"/>

  <!-- rails down to services -->
  <path d="M269 646 L269 742" stroke="#22c55e" stroke-width="1.6" marker-end="url(#aGreen)" opacity=".85"/>
  <path d="M667 646 L700 742" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#aBlue)" opacity=".85"/>
  <path d="M1065 646 L1140 742" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#aBlue)" opacity=".85"/>

  <!-- ══════════════════════ 3 · services ══════════════════════ -->
  <text x="56" y="776" class="zone">03 · EXTERNAL SERVICES</text>

  <!-- Bright Data -->
  <rect x="56" y="792" width="418" height="176" rx="12" fill="#0f1a12" stroke="#22c55e" stroke-opacity=".38"/>
  <g transform="translate(82 816) scale(1.15)" filter="url(#glowG)">
    <g clip-path="url(#bdclip)">
      <path d="M24.932 0H7.06797C3.16444 0 0 3.16444 0 7.06797V24.932C0 28.8356 3.16444 32 7.06797 32H24.932C28.8356 32 32 28.8356 32 24.932V7.06797C32 3.16444 28.8356 0 24.932 0Z" fill="white"/>
      <path d="M14.8116 22H5.94581C4.59502 22 3.65638 20.6623 4.11979 19.4011L7.05939 11.4157C7.37241 10.5654 8.18591 10 9.09627 10H15.0325C15.699 10 16.3202 10.3413 16.6771 10.9023L20.1655 16.3981C20.4297 16.814 21.0568 16.7492 21.2303 16.2903L23.6105 10H28L23.9951 20.7388C23.7131 21.4979 22.9854 22 22.173 22H19.3334C18.6648 22 18.0417 21.6587 17.6868 21.0938L12.1634 12.3459C11.8991 11.9281 11.2701 11.9928 11.0965 12.4557L8.67104 18.9735C8.52709 19.3619 8.81499 19.7738 9.23107 19.7738H13.3859L14.8097 22H14.8116Z" fill="black"/>
    </g>
  </g>
  <clipPath id="bdclip"><rect width="32" height="32"/></clipPath>
  <text x="132" y="836" class="name">Bright Data</text>
  <text x="132" y="856" class="mono" fill="#4ade80">THE ONLY SEARCH PATH — NO FALLBACK</text>
  <text x="82" y="896" class="sub">▸ SERP API — parsed Google, <tspan class="mono">site:</tspan> filters work</text>
  <text x="82" y="920" class="sub">▸ Web Scraper API — LinkedIn Profiles dataset</text>
  <text x="82" y="948" class="mono">gd_l1viktl72bvl7bjuj0</text>

  <!-- AI/ML API -->
  <rect x="494" y="792" width="418" height="176" rx="12" fill="#0d1520" stroke="#60a5fa" stroke-opacity=".38"/>
  <g transform="translate(520 816)">
    <rect width="37" height="37" rx="10" fill="#fafafa"/>
    <text x="18.5" y="24" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#09090b">AI</text>
  </g>
  <text x="570" y="836" class="name">AI/ML API</text>
  <text x="570" y="856" class="mono" fill="#93c5fd">ONE KEY · TWO MODELS · OPENAI-COMPATIBLE</text>
  <text x="520" y="896" class="sub">▸ <tspan class="mono">gpt-4o-mini</tspan> — extraction, high volume</text>
  <text x="520" y="920" class="sub">▸ <tspan class="mono">gpt-4o</tspan> — synthesis, low volume</text>
  <text x="520" y="948" class="mono">chosen per pass, swappable by env</text>

  <!-- Postgres -->
  <rect x="932" y="792" width="412" height="176" rx="12" class="card"/>
  <g transform="translate(958 816)">
    <rect width="37" height="37" rx="10" fill="#fafafa"/>
    <path d="M18.5 7 L27 22 h-8.5 z M18.5 30 L10 15 h8.5 z" fill="#09090b"/>
  </g>
  <text x="1008" y="836" class="name">Supabase Postgres</text>
  <text x="1008" y="856" class="mono">6 TABLES · RLS ON, ZERO POLICIES</text>
  <text x="958" y="896" class="sub">▸ functions connect with the service role</text>
  <text x="958" y="920" class="sub">▸ anon <tspan class="mono">SELECT</tspan> → <tspan class="mono">[]</tspan> · anon <tspan class="mono">INSERT</tspan> → <tspan class="mono">42501</tspan></text>
  <text x="958" y="948" class="mono">verified, not assumed</text>

  <!-- ══════════════════════ two-stage callout ══════════════════════ -->
  <g transform="translate(56 690)">
    <rect width="1288" height="56" rx="10" fill="#141418" stroke="#22c55e" stroke-opacity=".3"/>
    <circle cx="30" cy="28" r="4" fill="#22c55e"/>
    <text x="52" y="24" class="sub" fill="#e4e4e7">
      <tspan font-weight="600" fill="#fafafa">People calls Bright Data twice.</tspan>
      SERP runs <tspan class="mono" fill="#4ade80">site:linkedin.com/in</tspan> to find profile URLs — then those URLs become the input to the
    </text>
    <text x="52" y="43" class="sub" fill="#e4e4e7">
      Datasets API, which returns structured person records. Stage one decides what stage two scrapes. That is the agentic part.
    </text>
  </g>

  <!-- ══════════════════════ legend ══════════════════════ -->
  <g transform="translate(56 990)">
    <circle cx="6" cy="-4" r="4" fill="#22c55e"/>
    <text x="18" y="0" class="mono">evidence path — Bright Data</text>
    <circle cx="246" cy="-4" r="4" fill="#60a5fa"/>
    <text x="258" y="0" class="mono">reasoning path — AI/ML API</text>
    <circle cx="486" cy="-4" r="4" fill="#71717a"/>
    <text x="498" y="0" class="mono">internal flow</text>
    <text x="1080" y="0" class="mono">Venture Foundry · AI Factory hackathon 2026</text>
  </g>
</svg>
