<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 420" width="1220" height="420" role="img" aria-label="Ideation, Market and People write to the shared startup profile; Capital reads from it">
  <defs>
    <marker id="mf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="mf-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9b9ba3"/>
    </marker>
  </defs>
  <style>
    .name  { font-family:'Segoe UI',system-ui,sans-serif; font-size:16px; font-weight:600; fill:#fafafa }
    .write { font-family:ui-monospace,'Cascadia Mono',monospace; font-size:11.5px; fill:#4ade80 }
    .read  { font-family:ui-monospace,monospace; font-size:11.5px; fill:#c4c4cc }
    .n     { font-family:ui-monospace,monospace; font-size:10.5px; fill:#52525b; letter-spacing:1.2px }
    .kick  { font-family:ui-monospace,monospace; font-size:11px; fill:#6b6b73; letter-spacing:2.2px }
    .box   { fill:#141418; stroke:#2a2a30 }
  </style>

  <rect width="1220" height="420" fill="#09090b"/>
  <text x="48" y="46" class="kick">ONE FILE — THREE MODULES WRITE TO IT, THE FOURTH READS IT BACK</text>

  <!-- ── writers ── -->
  <g transform="translate(48 84)">
    <rect width="286" height="76" rx="10" class="box"/>
    <g transform="translate(22 24)" stroke="#fafafa" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18h6"/><path d="M10 21h4"/>
      <path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.6V18h6v-2.1c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 2.5Z"/>
    </g>
    <text x="60" y="34" class="n">01</text>
    <text x="60" y="54" class="name">Ideation</text>
  </g>

  <g transform="translate(48 190)">
    <rect width="286" height="76" rx="10" class="box"/>
    <g transform="translate(22 24)" stroke="#fafafa" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v17.5h18"/>
      <rect x="6.5" y="13" width="3.2" height="5" rx=".6"/>
      <rect x="11.9" y="9.5" width="3.2" height="8.5" rx=".6"/>
      <rect x="17.3" y="6" width="3.2" height="12" rx=".6"/>
    </g>
    <text x="60" y="34" class="n">02</text>
    <text x="60" y="54" class="name">Market</text>
  </g>

  <g transform="translate(48 296)">
    <rect width="286" height="76" rx="10" class="box"/>
    <g transform="translate(22 24)" stroke="#fafafa" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="8" r="3.4"/>
      <path d="M2.8 19.5a6.2 6.2 0 0 1 12.4 0"/>
      <path d="M16.2 5.1a3.4 3.4 0 0 1 0 6.6"/>
      <path d="M17.8 14.2a6.2 6.2 0 0 1 3.4 5.3"/>
    </g>
    <text x="60" y="34" class="n">03</text>
    <text x="60" y="54" class="name">People</text>
  </g>

  <!-- ── write arrows, each labelled with the field it sets ── -->
  <path d="M334 122 C 400 122, 420 190, 486 190" stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#mf-a)"/>
  <text x="352" y="112" class="write">writes domain</text>

  <path d="M334 228 H 486" stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#mf-a)"/>
  <text x="352" y="218" class="write">writes idea_text</text>

  <path d="M334 334 C 400 334, 420 266, 486 266" stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#mf-a)"/>
  <text x="352" y="360" class="write">writes founder_skills</text>

  <!-- ── the file ── -->
  <g transform="translate(494 148)">
    <rect width="278" height="160" rx="12" fill="#0f1a12" stroke="#22c55e" stroke-opacity=".45"/>
    <text x="26" y="38" class="n">SHARED STATE</text>
    <text x="26" y="64" class="name" font-size="18">Startup profile</text>
    <g stroke="#4ade80" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
      <path d="M26 92h150"/><path d="M26 112h198"/><path d="M26 132h120"/>
    </g>
    <g transform="translate(226 106)" stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="13" cy="13" r="12"/><path d="M7 13l4 4 8-9"/>
    </g>
  </g>

  <!-- ── reader ── -->
  <path d="M772 228 H 902" stroke="#9b9ba3" stroke-width="1.8" fill="none" marker-end="url(#mf-b)"/>
  <text x="790" y="218" class="read">reads domain + latest TAM</text>

  <g transform="translate(910 190)">
    <rect width="262" height="76" rx="10" class="box"/>
    <g transform="translate(22 24)" stroke="#fafafa" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="7.5" ry="3"/>
      <path d="M4.5 6v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/>
      <path d="M4.5 11v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5"/>
    </g>
    <text x="60" y="34" class="n">04</text>
    <text x="60" y="54" class="name">Capital</text>
  </g>

  <text x="910" y="292" class="read" fill="#8b8b93">nothing is retyped</text>
</svg>
