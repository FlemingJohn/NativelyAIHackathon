<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Favicon: the aperture mark, redrawn for 16px.
       The in-app logo uses four thin blades at stroke 1.75; at favicon size
       those close up into a muddy ring. Heavier strokes, wider gaps and a
       larger focal dot keep the shape readable in a browser tab. -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <g stroke="#fafafa" stroke-width="2.6" stroke-linecap="round">
    <path d="M26 17.4A9.4 9.4 0 0 1 17.4 26"/>
    <path d="M14.6 26A9.4 9.4 0 0 1 6 17.4"/>
    <path d="M6 14.6A9.4 9.4 0 0 1 14.6 6"/>
    <path d="M17.4 6A9.4 9.4 0 0 1 26 14.6"/>
  </g>
  <circle cx="16" cy="16" r="3.4" fill="#fafafa"/>
</svg>
